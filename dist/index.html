<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0605">
  <meta name="description" content="An Unpredictable Person: Hemangi's little picture house. Pick a reel, load the projector, and see which side of her is showing today.">
  <meta property="og:title" content="An Unpredictable Person · Hemangi">
  <meta property="og:description" content="Singing, painting, art, craft & clay, fashion and brewing. Pick a reel and step into the cinema.">
  <meta property="og:image" content="assets/title.webp">
  <title>An Unpredictable Person · Hemangi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23140d0a'/%3E%3Ccircle cx='20' cy='20' r='15' fill='%23f2b705'/%3E%3Cg fill='%23140d0a'%3E%3Ccircle cx='20' cy='11' r='4'/%3E%3Ccircle cx='12' cy='24' r='4'/%3E%3Ccircle cx='28' cy='24' r='4'/%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Yellowtail&display=swap">
  <link rel="preload" as="image" href="assets/bg.webp">
  <link rel="preload" as="image" href="assets/bg-front.webp">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="cinema" id="cinema" aria-label="Hemangi's cinema portfolio">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img class="layer" src="assets/bg.webp" alt="" width="1670" height="942" decoding="async">

        <section class="screen" id="screen" aria-label="Cinema screen" aria-live="polite">
          <div class="scene welcome" id="welcome">
            <div class="welcome-poses" aria-hidden="true">
              <img class="welcome-pose" src="assets/pose-1.webp" alt="" width="325" height="775" decoding="async">
              <img class="welcome-pose" src="assets/pose-2.webp" alt="" width="326" height="762" decoding="async">
              <img class="welcome-pose" src="assets/pose-3.webp" alt="" width="252" height="756" decoding="async">
              <img class="welcome-pose" src="assets/pose-4.webp" alt="" width="272" height="760" decoding="async">
              <img class="welcome-pose" src="assets/pose-5.webp" alt="" width="331" height="768" decoding="async">
            </div>
            <div class="title-breathe"><img class="title-art" src="assets/title.webp" alt="An Unpredictable Person" width="1688" height="879"></div>
          </div>

          <div class="scene leader" id="leader" hidden aria-hidden="true">
            <div class="leader-dial"><span id="leader-num">3</span></div>
          </div>

          <div class="scene titlecard" id="titlecard" hidden>
            <span class="tc-act" id="tc-act"></span>
            <h2 class="tc-title" id="tc-title"></h2>
            <p class="tc-tagline" id="tc-tagline"></p>
            <p class="tc-note" id="tc-note" hidden>This reel is still being spliced together. Check back soon.</p>
          </div>

          <div class="scene player" id="player" hidden>
            <div class="slide-holder" id="slide-holder"></div>
            <div class="player-top">
              <span class="player-reel" id="player-reel"></span>
              <span class="player-count" id="player-count"></span>
              <span class="spacer"></span>
              <button class="chip" id="btn-theatre" type="button" aria-label="Theatre mode"><span aria-hidden="true">⤢</span><span class="chip-label">Theatre</span></button>
              <button class="chip" id="btn-eject" type="button" aria-label="Eject reel"><span aria-hidden="true">⏏</span><span class="chip-label">Eject</span></button>
            </div>
            <button class="nav prev" id="btn-prev" type="button" aria-label="Previous">‹</button>
            <button class="nav next" id="btn-next" type="button" aria-label="Next">›</button>
            <p class="caption" id="caption"></p>
          </div>

          <div class="screen-fx" aria-hidden="true"></div>
        </section>

        <img class="layer front" src="assets/bg-front.webp" alt="" width="1670" height="942" decoding="async">

        <svg class="beam" viewBox="0 0 1670 942" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="beam-grad" gradientUnits="userSpaceOnUse" x1="1160" y1="471" x2="600" y2="360">
              <stop offset="0" stop-color="#fff6d0" stop-opacity=".55"/>
              <stop offset=".55" stop-color="#ffe9a8" stop-opacity=".16"/>
              <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
            </linearGradient>
            <filter id="beam-blur"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>
          <polygon points="1160,447 1005,122 168,122 168,600 1160,495" fill="url(#beam-grad)" filter="url(#beam-blur)"/>
        </svg>

        <button class="projector" id="projector" type="button" aria-label="Projector. Drop or choose a reel to play it.">
          <img src="assets/camera.webp" alt="" width="986" height="1165" draggable="false">
          <span class="lens-glow" aria-hidden="true"></span>
          <span class="drop-tag" aria-hidden="true">drop a reel here</span>
        </button>
      </div>
    </div>
    <div class="bottom-ribbon" aria-hidden="true"></div>

    <header class="topbar">
      <span class="marquee">Hemangi's Picture House</span>
      <p class="hint" id="hint">Pick a reel. Drag it to the projector.</p>
      <div class="top-actions">
        <button class="chip ghost" id="btn-sound" type="button" aria-pressed="true" aria-label="Projector sound">♪ <span class="chip-label" id="sound-label">Sound on</span></button>
        <button class="chip ghost" id="btn-credits" type="button">Credits</button>
      </div>
    </header>

    <nav class="shelf" id="shelf" aria-label="Choose a reel"></nav>
  </main>

  <dialog class="credits" id="credits" aria-labelledby="credits-title">
    <div class="credits-roll">
      <p class="credits-kicker">The end credits</p>
      <h2 id="credits-title">Starring <span id="credits-name">Hemangi</span></h2>
      <p class="credits-about" id="credits-about"></p>
      <dl class="credits-list" id="credits-list"></dl>
      <div class="credits-links" id="credits-links"></div>
      <form method="dialog"><button class="chip" type="submit">Back to the show</button></form>
    </div>
  </dialog>

  <div class="sr-only" id="status" role="status" aria-live="polite"></div>
</body>
</html>
